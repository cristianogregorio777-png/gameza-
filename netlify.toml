[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_PUBLIC_SUPABASE_URL = "https://rpbojjxwptsgbeyqndlw.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY = "sb_publishable_JqOeuBtTki1sOKkytuMdbg_PQ0ivJan"
  NEXT_PUBLIC_TURNSTILE_SITE_KEY = "0x4AAAAAAE6HvflBnXmRlcQq"
  # Configure estas chaves secretas no painel do Netlify:
  # SUPABASE_SERVICE_ROLE_KEY = "..."
  # TURNSTILE_SECRET_KEY = "..."

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https://*.supabase.co https://api.groq.com;"